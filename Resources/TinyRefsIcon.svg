<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">TinyRefs</title>
  <desc id="description">Two overlapping glass bibliography cards with BibLaTeX braces on an indigo app tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.72" y2="1">
      <stop stop-color="#5c73e1"/>
      <stop offset=".48" stop-color="#3842a9"/>
      <stop offset="1" stop-color="#25205f"/>
    </linearGradient>
    <radialGradient id="tileLight" cx=".15" cy=".04" r=".92">
      <stop stop-color="#8ac5ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8ac5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tileColor" cx=".89" cy=".82" r=".58">
      <stop stop-color="#9464ef" stop-opacity=".37"/>
      <stop offset="1" stop-color="#9464ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileEdge" x1=".15" y1="0" x2=".72" y2="1">
      <stop stop-color="#e3f2ff" stop-opacity=".62"/>
      <stop offset=".48" stop-color="#a9b4ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#a392f6" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="backCard" x1=".25" y1="0" x2=".75" y2="1">
      <stop stop-color="#b7efff"/>
      <stop offset=".53" stop-color="#869ef4"/>
      <stop offset="1" stop-color="#7d6cd1"/>
    </linearGradient>
    <linearGradient id="frontCard" x1=".19" y1="0" x2=".87" y2="1">
      <stop stop-color="#f4fbff"/>
      <stop offset=".42" stop-color="#dce8ff"/>
      <stop offset="1" stop-color="#b4baf6"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1=".18" y1="0" x2=".82" y2="1">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".43"/>
      <stop offset="1" stop-color="#e5dfff" stop-opacity=".63"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#293477"/>
      <stop offset="1" stop-color="#44469d"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="23"/>
    </filter>
    <path id="tileShape" d="M309 78H715C881 78 946 143 946 309V715C946 881 881 946 715 946H309C143 946 78 881 78 715V309C78 143 143 78 309 78Z"/>
    <path id="brace" d="M397 397H387C363 397 352 408 352 432V448C352 466 344 477 328 482C344 487 352 498 352 516V532C352 556 363 567 387 567H397"/>
  </defs>

  <g id="background">
    <use href="#tileShape" transform="translate(0 14)" fill="#17143e" opacity=".34" filter="url(#tileShadow)"/>
    <use href="#tileShape" fill="url(#tile)"/>
    <use href="#tileShape" fill="url(#tileLight)"/>
    <use href="#tileShape" fill="url(#tileColor)"/>
    <use href="#tileShape" fill="none" stroke="url(#tileEdge)" stroke-width="3"/>
  </g>

  <g id="cards">
    <g id="back-card" transform="rotate(12 547 482)">
      <rect x="360" y="254" width="414" height="490" rx="74" fill="#151644" opacity=".46" filter="url(#cardShadow)"/>
      <rect x="353" y="232" width="414" height="490" rx="74" fill="url(#backCard)" fill-opacity=".85" stroke="url(#cardEdge)" stroke-width="4"/>
    </g>
    <g id="front-card" transform="rotate(-8 483 531)">
      <rect x="261" y="306" width="446" height="493" rx="74" fill="#1d195a" opacity=".57" filter="url(#cardShadow)"/>
      <rect x="255" y="282" width="446" height="493" rx="74" fill="url(#frontCard)" stroke="url(#cardEdge)" stroke-width="4"/>
      <path d="M306 320C316 313 329 309 345 309H603" fill="none" stroke="#fff" stroke-opacity=".67" stroke-width="3" stroke-linecap="round"/>
      <g id="biblatex" transform="translate(0 38)" fill="none" stroke="url(#ink)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
        <use href="#brace"/>
        <use href="#brace" transform="translate(956 0) scale(-1 1)"/>
        <path d="M446 457H520M446 507H499" stroke-width="19" opacity=".82"/>
      </g>
    </g>
  </g>
</svg>
